{% extends 'catalogo/base.html' %}

{% block content %}

<h1>Lista de categorias</h1>

<a class="btn btn-primary" href="{% url 'create-category' %}">Nueva Categoria</a>

<table class="table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for category in listado %}
        <tr>
            <td>{{category.id}}</td>
            <td>{{category.titulo}}</td>
            <td>{{category.descripcion}}</td>
            <td> 
                <a class="btn btn-danger" href="#"><i class="bi bi-trash"></i></a> 
                <a class="btn btn-warning" href="#"><i class="bi bi-pencil"></i></a> 
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">
                <h3>No hay categorias</h3>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
