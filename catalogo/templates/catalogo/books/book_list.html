{% extends 'catalogo/base.html' %}

{% block content %}

<a class="btn btn-primary" href="{% url 'create-book' %}">Nuevo Libro</a>

<table class="table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Description</th>
            <th>Year</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for libro in listado %}
        <tr>
            <td>{{libro.id}}</td>
            <td>{{libro.titulo}}</td>
            <td>{{libro.descripcion}}</td>
            <td>{{libro.publicacion}}</td>
            <td> 
                <a class="btn btn-danger" href="{% url 'delete-book' libro.id %}"><i class="bi bi-trash"></i></a> 
                <a class="btn btn-warning" href="{% url 'update-book' libro.id %}"><i class="bi bi-pencil"></i></a>
                <a class="btn btn-info" href="{% url 'detail-book' libro.id %}"><i class="bi bi-eye"></i></a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">
                <h3>No hay libros</h3>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
