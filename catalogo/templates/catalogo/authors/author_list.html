{% extends 'catalogo/base.html' %}

{% block content %}

<a class="btn btn-primary" href="{% url 'create-author' %}">Nuevo Autor</a>

<table class="table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for author in listado %}
        <tr>
            <td>{{author.id}}</td>
            <td>{{author.nombre}}</td>
            <td> 
                <a class="btn btn-danger" href="#"><i class="bi bi-trash"></i></a> 
                <a class="btn btn-warning" href="#"><i class="bi bi-pencil"></i></a> 
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">
                <h3>No hay autores</h3>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
