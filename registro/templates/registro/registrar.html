{% extends "catalogo/base.html" %}
{% load crispy_forms_tags %}

{% block content %}

<h1>Crear cuenta</h1>

<form method="POST">
    {% csrf_token %}
    {{form|crispy}}

    <button class="btn btn-success">Registrarse</button>
    <a class="btn btn-light" href="{% url 'login' %}">Volver</a>
</form>

{% endblock content %}
